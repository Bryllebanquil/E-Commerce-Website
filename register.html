<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Ecommerce</title>
  <link rel="stylesheet" href="./assets/css/style-prefix.css">
  <link rel="stylesheet" href="./assets/css/register.css">
</head>
<body>
  <!-- Register Container -->
  <main class="register-main">
    <div class="register-container">
      <!-- Left Section - Brand Info -->
      <div class="register-brand">
        <div class="brand-content">
          <h1 class="brand-title">Join E-Commerce Today</h1>
          <p class="brand-text">Create an account to enjoy exclusive offers and faster checkout</p>
          <p class="brand-text">Already have an account? <a href="login.html" class="brand-link">Sign in here</a></p>
        </div>
      </div>

      <!-- Right Section - Register Form -->
      <div class="register-form-wrapper">
        <!-- Right where your form starts -->
        <form class="register-form" id="registerForm" action="register.php" method="post">

          <h2 class="form-title">Create Account</h2>
          
          <!-- Username used for login (stored in users.username) -->
          <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" name="username" class="form-input" placeholder="Choose a username" required>
            <span class="form-error" id="usernameError"></span>
          </div>

          <!-- Full Name Input -->
          <div class="form-group">
            <label for="fullname" class="form-label">Full Name</label>
            <input type="text" id="fullname" name="fullname" class="form-input" placeholder="Enter your full name" required>
            <span class="form-error" id="fullnameError"></span>
          </div>

          <!-- Email Input -->
          <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email" required>
            <span class="form-error" id="emailError"></span>
          </div>

          <!-- Password Input -->
          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="Create a strong password" required>
            <span class="form-error" id="passwordError"></span>
            <p class="password-hint">At least 8 characters, including uppercase, lowercase, and numbers</p>
          </div>

          <!-- Confirm Password Input -->
          <div class="form-group">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="Confirm your password" required>
            <span class="form-error" id="confirmPasswordError"></span>
          </div>

          <!-- Phone Number Input -->
          <div class="form-group">
            <label for="phone" class="form-label">Phone Number</label>
            <input type="tel" id="phone" name="phone" class="form-input" placeholder="Enter your phone number" required>
            <span class="form-error" id="phoneError"></span>
          </div>


          <!-- Terms & Conditions -->
          <div class="form-checkbox">
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
            <span class="form-error" id="termsError"></span>
          </div>

          <!-- Newsletter Signup -->
          <div class="form-checkbox">
            <input type="checkbox" id="newsletter" name="newsletter">
            <label for="newsletter">Send me exclusive offers and updates</label>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn-register">Create Account</button>

          <!-- Divider -->
          <div class="form-divider">
            <span>Or sign up with</span>
          </div>

          <!-- Social Signup -->
          <div class="social-login">
            <button type="button" class="social-btn google-btn" id="googleSignup">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M10 0C4.477 0 0 4.477 0 10s4.477 10 10 10 10-4.477 10-10S15.523 0 10 0z" fill="#fff"/>
              </svg>
              Google
            </button>
            <button type="button" class="social-btn facebook-btn" id="facebookSignup">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M10 0C4.477 0 0 4.477 0 10s4.477 10 10 10 10-4.477 10-10S15.523 0 10 0z" fill="#fff"/>
              </svg>
              Facebook
            </button>
          </div>

          <!-- Sign In Link -->
          <p class="signin-text">Already have an account? <a href="login.html">Sign in</a></p>
        </form>
      </div>
    </div>
  </main>

  <script src="./assets/js/script.js"></script>
</body>
</html>
