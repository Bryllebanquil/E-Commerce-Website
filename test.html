<!DOCTYPE html>
<html>
<head>
  <style>
    html {
      scroll-behavior: smooth;
    }

    .scroll-top-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 10px 15px;
      background: black;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
    }
  </style>
</head>
<body>

<div id="top"></div>

<h1>Scroll down then press the button</h1>
<p style="height:2000px;">Big space to scroll…</p>

<a href="#top" class="scroll-top-btn">↑ Top</a>

</body>
</html>
