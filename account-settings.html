      <div style="margin-bottom:22px;">

<script src="./assets/js/script.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var userBtn = document.querySelector('.user-menu-btn');
  var userMenu = document.querySelector('.user-menu-dropdown');
  if (userBtn && userMenu) {
    userBtn.addEventListener('mouseenter', function() {
      userMenu.style.display = 'block';
    });
    userBtn.addEventListener('mouseleave', function() {
      setTimeout(function() {
        if (!userMenu.matches(':hover')) userMenu.style.display = 'none';
      }, 150);
    });
    userMenu.addEventListener('mouseleave', function() {
      userMenu.style.display = 'none';
    });
    userMenu.addEventListener('mouseenter', function() {
      userMenu.style.display = 'block';
    });
  }
  var logoutLink = document.getElementById('logout-link');
  if (logoutLink) {
    logoutLink.addEventListener('click', function(e) {
      e.preventDefault();
      window.location.href = 'home.html';
    });
  }
});
</script>
